<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园社团活动管理平台</title>
    <!-- 外部CDN依赖 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 本地css -->
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/activity.css">
    <link rel="stylesheet" href="./css/enroll.css">
    <link rel="stylesheet" href="./css/club.css">
    <link rel="stylesheet" href="./css/stat.css">
</head>
<body>
<!-- 登录注册页面 -->
<div id="loginPage" class="page active container mt-5" style="max-width:450px;">
    <ul class="nav nav-tabs mb-3" id="tab">
        <li class="nav-item"><button class="nav-link active" onclick="switchTab('login')">登录</button></li>
        <li class="nav-item"><button class="nav-link" onclick="switchTab('register')">注册</button></li>
    </ul>
    <div id="loginForm">
        <div class="mb-3">
            <label>学号/工号</label>
            <input type="text" id="loginUsername" class="form-control" placeholder="输入账号">
        </div>
        <div class="mb-3">
            <label>密码</label>
            <input type="password" id="loginPwd" class="form-control" placeholder="输入密码">
        </div>
        <button class="btn btn-primary w-100" onclick="login()">登录</button>
    </div>
    <div id="registerForm" style="display:none;">
        <div class="mb-3">
            <label>学号/工号</label>
            <input type="text" id="regUsername" class="form-control" placeholder="唯一账号">
        </div>
        <div class="mb-3">
            <label>姓名</label>
            <input type="text" id="regName" class="form-control">
        </div>
        <div class="mb-3">
            <label>角色</label>
            <select id="regRole" class="form-select">
                <option value="STUDENT">学生</option>
                <option value="LEADER">社团负责人</option>
                <option value="ADMIN">系统管理员</option>
            </select>
        </div>
        <div class="mb-3">
            <label>密码</label>
            <input type="password" id="regPwd" class="form-control">
        </div>
        <button class="btn btn-success w-100" onclick="register()">注册</button>
    </div>
</div>

<!-- 主布局容器（登录后加载pages内页面片段） -->
<div id="mainPage" class="page">
    <div class="row m-0">
        <!-- 侧边导航栏 -->
        <div class="col-2 sidebar p-0">
            <h4 class="p-3 border-bottom">社团管理系统</h4>
            <a href="#" data-page="activityList" class="nav-menu active">活动首页</a>
            <a href="#" data-page="myEnroll" class="nav-menu">我的报名</a>
            <a href="#" data-page="clubList" class="nav-menu">社团列表</a>
            <a href="#" data-page="publishAct" id="menuPublish">发布活动</a>
            <a href="#" data-page="statPage" id="menuStat">数据统计</a>
            <a href="#" onclick="logout()" class="mt-5 text-danger">退出登录</a>
        </div>
        <!-- 右侧内容容器，动态加载pages页面 -->
        <div class="col-10 p-4" id="contentContainer"></div>
    </div>
</div>

<!-- 弹窗容器，动态加载modal弹窗模板 -->
<div id="modalContainer"></div>

<!-- 引入JS顺序：公共工具最先加载 -->
<script src="./js/common.js"></script>
<script src="./js/login.js"></script>
<script src="./js/activity.js"></script>
<script src="./js/enroll.js"></script>
<script src="./js/club.js"></script>
<script src="./js/comment.js"></script>
<script src="./js/reviewLike.js"></script>
<script src="./js/stat.js"></script>
</body>
</html>
